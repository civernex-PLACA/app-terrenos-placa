<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Terrenos PWA</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  
  <!-- LIBRERÍAS EXTERNAS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  
  <!-- ESTILOS PROPIOS -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div id="login-screen">
    <h1>Terrenos App</h1>
    <p class="login-subtitle">Acceso exclusivo Placa Estudio</p>
    <button class="btn-google" onclick="iniciarSesion()">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google"> Iniciar sesión
    </button>
  </div>

  <!-- CONTENIDO PRINCIPAL DE LA APLICACIÓN -->
  <div id="app-content">

    <!-- CONTENEDOR DE AVATARES DE PRESENCIA -->
    <div id="avatar-stack" class="avatar-stack"></div>
    
    <!-- Mapa de Leaflet -->
    <div id="map"></div>
    
    <!-- Cartel de Instrucciones (modo agregar) -->
    <div id="loading-toast" class="toast-container">
      <span id="icono-spinner"></span>
      <span id="toast-msg">Procesando...</span>
    </div>

    <!-- Pila de Notificaciones de Carga (pueden mostrarse varias a la vez) -->
    <div id="toast-stack" class="toast-stack"></div>
  
<!-- DOCK DE HERRAMIENTAS VECTORIAL (BARRA CONTINUA) -->
 
<div class="app-dock">
  <button id="btn-logout" class="dock-btn btn-logout-dock" title="Cerrar Sesión" onclick="cerrarSesion()">
    <span id="icono-logout"></span>
  </button>

  <button id="btn-add" class="dock-btn btn-primary-action" title="Agregar Terreno" onclick="toggleAddMode(event)">
    <span id="icono-agregar"></span>
  </button>

  <button id="btn-location" class="dock-btn" title="Mi Ubicación" onclick="obtenerUbicacionActual()">
    <span id="icono-gps"></span>
  </button>


<button id="btn-secciones" class="dock-btn" onclick="window.Poligonos.toggleSecciones()" title="Ver Secciones">
  <span id="icono-secciones"></span>
</button>

<button id="btn-overlay-parcelas" class="dock-btn" onclick="window.OverlayCatastro.toggleManual()" title="Ver Parcelas y Calles">
  <span id="icono-overlay-parcelas"></span>
</button>

  <button id="btn-satelite" class="dock-btn" title="Cambiar Vista Satelital / Mapa" onclick="toggleCapasMapa()">
    <span id="icono-satelite"></span>
  </button>
</div>

    <!-- PANEL ADAPTATIVO DEL FORMULARIO (🟢 Estilos CSS purgados) -->
    <div id="modal-terreno">
      <div class="panel-content">
        <h2 id="titulo-form">Ficha del Terreno</h2>
        
        <div class="form-grid">
          <div class="form-group">
            <label>Visitado</label>
            <select id="f-visitado"><option value="NO">No</option><option value="SI">Sí</option></select>
          </div>
          
          <div class="form-group">
            <label>Relevó</label>
            <select id="f-relevo">
              <option value=""></option>
              <option value="Tomás">Tomás</option>
              <option value="Gastón">Gastón</option>
              <option value="Renzo">Renzo</option>
              <option value="Ezequiel">Ezequiel</option>
            </select>
          </div>
          
          <div class="form-group"><label>Distrito</label><input type="text" id="f-distrito"></div>
          <div class="form-group"><label>ID GIS</label><input type="text" id="f-idgis"></div>
          <div class="form-group"><label>Barrio</label><input type="text" id="f-barrio"></div>
          
          <div class="form-group span-2"><label>Dirección / Calle</label><input type="text" id="f-direccion"></div>
          
          <div class="form-group">
            <label>Tipo de Lote</label>
            <select id="f-tipolote">
              <option value="Entre Medianeras">Entre Medianeras</option>
              <option value="Pasante Entre Medianeras">Pasante Entre Medianeras</option>
              <option value="Esquina">Esquina</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Estado</label>
            <select id="f-estado">
              <option value="Baldío">Baldío</option>
              <option value="Con Construcción">Con Construcción</option>
            </select>
          </div>
          
          <div class="form-group"><label>Frente (m)</label><input type="text" id="f-frente" placeholder="Ej: 10,5"></div>
          <div class="form-group"><label>Fondo (m)</label><input type="text" id="f-fondo" placeholder="Ej: 30,0"></div>
          <div class="form-group"><label>Superficie (aprox.)</label><input type="text" id="f-superficie-preview" placeholder="—" disabled></div>

          <!-- 🔴 Sugerencia de frente (motorFrente.js) — oculto por default,
               solo aparece con devFlags.frenteSugerido=true (ver dev.js).
               Informativo, nunca autocompleta el campo Frente. -->
          <div class="form-group span-2" id="frente-sugerido-container" style="display:none;">
            <label>🔴 Frente sugerido (sin validar)</label>
            <div id="frente-sugerido-texto" class="frente-sugerido-texto">—</div>
          </div>

          <div class="form-group"><label>Agua</label><select id="f-agua"><option value=""></option><option value="SI">Sí</option><option value="NO">No</option></select></div>
          <div class="form-group"><label>Cloaca</label><select id="f-cloaca"><option value=""></option><option value="SI">Sí</option><option value="NO">No</option></select></div>

          <div class="form-group"><label>Propietario</label><input type="text" id="f-propietario"></div>
          <div class="form-group"><label>Contacto</label><input type="text" id="f-contacto" value="3764"></div>

          <div class="form-group span-2">
            <label>Vendedor</label>
            <select id="f-vendedor">
              <option value=""></option>
              <option value="Dueño Directo">Dueño Directo</option>
              <option value="Inmobiliaria">Inmobiliaria</option>
            </select>
          </div>
          <div class="form-group span-2"><label>Notas</label><textarea id="f-notas"></textarea></div>
        </div>

        <!-- CAMPO PARA CAPTURA Y SUBIDA DE FOTOS DE RELEVAMIENTO -->
        <div class="form-group">
          <label for="f-fotos">Fotos del Terreno (Cámara / Galería):</label>
          <input type="file" id="f-fotos" accept="image/*" multiple class="input-file">
          <small class="helper-text-fotos">
            📷 Las fotos se comprimirán automáticamente a 2K con máxima nitidez antes de guardarse en tu Google Drive.
          </small>
          <div id="vista-previa-fotos" class="contenedor-previa-fotos"></div>
        </div>

        <button id="btn-guardar-form" class="btn-form btn-primary" onclick="procesarFormulario()">Guardar Terreno</button>
        <button class="btn-form btn-secondary" onclick="cerrarModalTerreno()">Cancelar</button>
      </div>
    </div>

  </div>

<!-- LOGGER DE ERRORES Y BITÁCORA DE RASTREO (DEV TRACE) -->
  <script>
    window.DevTrace = {
      log: function(modulo, evento, detalle = '') {
        // Los mensajes ahora solo van a la consola invisible (F12) para no molestar al usuario
        console.log(`[DevTrace] ${modulo} -> ${evento}`, detalle);
      },
      error: function(msg) {
        console.error(`[DevTrace ERROR] ${msg}`);
      },
      _imprimirEnPantalla: function(htmlMsg, colorBorde) {
        // 🟢 FUNCIÓN VACIADA: Ya no creará la caja negra en la pantalla
      }
    };

    window.onerror = function(msg, url, linea, col, error) {
      const archivo = url ? url.substring(url.lastIndexOf('/') + 1) : 'HTML/Desconocido';
      console.error(`${msg} - Archivo: ${archivo} (Línea ${linea})`);
      return false;
    };

    window.addEventListener('unhandledrejection', function(e) {
      console.error(`Promesa Rechazada: ${e.reason?.message || e.reason}`);
    });
  </script>

  <!-- MÓDULOS DE LA APP -->
  <script src="js/auth.js?v=4"></script>
  <script src="js/dev.js"></script>
  <script src="js/presencia.js?v=1"></script>
  <script src="js/geocoding.js?v=4"></script>
  <script src="js/GeoJson.js"></script>
  <script src="js/capasDrive.js"></script>
  <script src="js/overlayCatastro.js"></script>
  <script src="js/capasCalles.js"></script>
  <script src="js/motorFrente.js"></script>
  <script src="js/poligonos.js"></script>
  <script src="js/api.js?v=4"></script>
  <script src="js/editor.js"></script>
  <script src="js/formulario.js?v=4"></script>
  <script src="js/fotos.js?v=1"></script>
  <script src="js/iconos.js?v=1"></script>
  <script src="js/tags.js"></script>
  <script src="js/mapa.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
<script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registro) => {
            console.log('✅ [PWA] Service Worker registrado exitosamente con alcance:', registro.scope);
          })
          .catch((error) => {
            console.error('❌ [PWA] Error al registrar el Service Worker:', error);
          });
      });
    }
  </script>
</body>
</html>
