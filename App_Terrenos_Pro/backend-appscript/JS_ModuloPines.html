<script>
// ==========================================
// MÓDULO DE PINES Y POPUPS (Independiente)
// ==========================================

const ModuloPines = {
  
  // Dibuja el ícono SVG dependiendo del Color, Visita y Estado
  crearIcono: function(color, claseCSS, tachado = false, visitadoStr = "No", estadoStr = "Baldío") {
    const vStr = visitadoStr ? String(visitadoStr).toLowerCase() : "no";
    const isVisitado = (vStr === "si" || vStr === "sí");
    const eStr = estadoStr ? String(estadoStr).toLowerCase() : "baldío";
    const isConstruccion = eStr.includes("construcci");

    const lineaTachado = tachado ? "<line x1='4' y1='4' x2='20' y2='20' stroke='black' stroke-width='3' stroke-linecap='round'/>" : "";
    
    let innerSVG = "";

    if (isConstruccion) {
      // --- DISEÑO DE LA CASITA ---
      if (tachado) {
        // Casa Descartada
        innerSVG = "<path fill-rule='evenodd' d='M12 2L3 9h3v12h12V9h3L12 2z M12 11c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z' stroke='white' stroke-width='1.5'/>" + lineaTachado;
      } else if (isVisitado) {
        // Casa Visitada (Sólida con Tick)
        innerSVG = "<path d='M12 2L3 9h3v12h12V9h3L12 2z' stroke='white' stroke-width='1.5'/><path d='M9 14l2 2 4-4' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/>";
      } else {
        // Casa No Visitada (Con Agujero en el centro)
        innerSVG = "<path fill-rule='evenodd' d='M12 2L3 9h3v12h12V9h3L12 2z M12 11c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z' stroke='white' stroke-width='1.5'/>";
      }
    } else {
      // --- DISEÑO DE PIN CLÁSICO ---
      if (tachado) {
        innerSVG = "<path d='M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z' stroke='white' stroke-width='1.5'/>" + lineaTachado;
      } else if (isVisitado) {
        innerSVG = "<path d='M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z' stroke='white' stroke-width='1.5'/><path d='M9 9l2 2 4-4' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/>";
      } else {
        innerSVG = "<path d='M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z' stroke='white' stroke-width='1.5'/>";
      }
    }

    const svgHTML = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='" + color + "' width='30px' height='30px'>" + innerSVG + "</svg>";
    return L.divIcon({ className: "custom-pin " + claseCSS, html: svgHTML, iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -30] });
  },

  // Orquesta la creación de la capa visual
  armarMarcador: function(m) {
    let capaVisual;
    // Ahora le pasamos también el m.estado a la función
    const iconNormal = this.crearIcono(m.color, 'pin-normal', m.tachado, m.visitado, m.estado);
    
    if (m.poligono) {
      try { 
        const coords = JSON.parse(m.poligono); 
        capaVisual = L.polygon(coords, {color: m.color, weight: 3, fillOpacity: 0.4}); 
      } catch(e) { 
        capaVisual = L.marker([m.lat, m.lng], {icon: iconNormal}); 
      }
    } else { 
      capaVisual = L.marker([m.lat, m.lng], {icon: iconNormal}); 
    }
    
    const svgPin = "<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='currentColor'><path d='M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z'/></svg>";
    const svgEdit = "<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='currentColor'><path d='M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z'/></svg>";
    const tachadoTexto = m.tachado ? " (DESCARTADO)" : "";

    const htmlPopUp = 
      "<div id='fotos-" + m.id + "' style='min-height: 2px; margin-bottom: 5px;'></div>" +
      "<h3 style='margin:0 0 5px 0; color:" + m.color + ";'>" + m.id + tachadoTexto + "</h3>" +
      "<p class='popup-data'><b>Dirección:</b> " + m.direccion + "</p>" +
      "<p class='popup-data'><b>Distrito:</b> " + m.distrito + "</p>" +
      "<p class='popup-data'><b>Barrio:</b> " + m.barrio + "</p>" +
      "<p class='popup-data'><b>Estado:</b> " + m.estado + "</p>" +
      "<p class='popup-data'><b>Visitado:</b> " + (m.visitado || "No") + "</p>" +
      "<p class='popup-data'><b>Superficie:</b> " + (m.supTotal ? m.supTotal + " m²" : "-") + "</p>" +
      "<hr style='margin: 8px 0; border: 0; border-top: 1px solid #dadce0;'>" +
      "<p class='popup-data'><b>Propietario:</b> " + (m.propietario || "-") + "</p>" +
      "<p class='popup-data'><b>Contacto:</b> " + (m.contacto || "-") + "</p>" +
      "<p class='popup-data'><b>Vendedor:</b> " + (m.vendedor || "-") + "</p>" +
      "<p class='popup-data'><b>Relevó:</b> " + (m.relevo || "-") + "</p><br>" +
      "<div style='display:flex; gap:8px;'>" +
        "<a href='https://maps.google.com/maps?q=" + m.lat + "," + m.lng + "' target='_blank' style='display:flex; align-items:center; justify-content:center; gap:6px; flex:1; background:#f1f3f4; color:#1a73e8; padding:8px; text-decoration:none; border-radius:8px; font-weight:bold; font-size:13px; border: 1px solid #dadce0;'>" + svgPin + "Ruta</a>" +
        "<button onclick=\"abrirModalEdicion('" + m.id + "')\" style='display:flex; align-items:center; justify-content:center; gap:6px; flex:1; background:#fbbc04; color:white; border:none; padding:8px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:bold;'>" + svgEdit + "Editar</button>" +
      "</div>";

    capaVisual.bindPopup(htmlPopUp);
    return capaVisual;
  }
};
</script>
