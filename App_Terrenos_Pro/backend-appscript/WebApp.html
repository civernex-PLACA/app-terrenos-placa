    <!-- SCRIPT DE LÓGICA VISUAL Y PWA -->
    <script>
      function toggleLeyenda() {
        const leyenda = document.getElementById('leyenda-mapa');
        const flecha = document.getElementById('flecha-leyenda');
        leyenda.classList.toggle('oculta');
        if (leyenda.classList.contains('oculta')) { flecha.innerText = "▶"; } else { flecha.innerText = "◀"; }
      }

      // Detector de entorno (Para mostrar el Banner de Instalación)
      document.addEventListener("DOMContentLoaded", function() {
        // ¿Es un celular o tablet?
        const isMobile = /Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent);
        // ¿Ya está instalada nativamente?
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        
        // Mostrar el banner solo si es celular Y NO está instalada
        if (isMobile && !isStandalone) {
          document.getElementById('pwa-banner').style.display = 'flex';
        }
      });

      // Muestra las instrucciones específicas según si es iPhone o Android
      function mostrarGuiaPWA() {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const textoDiv = document.getElementById('pwa-instrucciones-texto');
        
        if (isIOS) {
          textoDiv.innerHTML = "Toca el botón <b>Compartir</b> <svg style='vertical-align: middle;' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8'></path><polyline points='16 6 12 2 8 6'></polyline><line x1='12' y1='2' x2='12' y2='15'></line></svg> en la barra inferior de Safari y luego desliza hacia abajo hasta seleccionar <b>'Agregar a inicio'</b> ➕.";
        } else {
          textoDiv.innerHTML = "Toca los <b>3 puntitos</b> ⋮ en la esquina superior derecha de tu navegador Chrome y selecciona <b>'Instalar aplicación'</b> o <b>'Agregar a la pantalla principal'</b>.";
        }
        
        document.getElementById('pwa-banner').style.display = 'none';
        document.getElementById('modal-pwa').style.display = 'flex';
      }
    </script>
