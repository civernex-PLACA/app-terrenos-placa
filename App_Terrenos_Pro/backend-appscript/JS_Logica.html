<script>
  // ==========================================
  // 0. MODO DESARROLLADOR Y VARIABLES
  // ==========================================
  const MODO_DESARROLLADOR = false; 
  const modulosActivos = { fotos: true, nucleo: true, formularios: true, geocoder: true, pines: true };

  const servidor = (metodo, ...parametros) => {
    return new Promise((resolve, reject) => {
      if (MODO_DESARROLLADOR) {
        if (metodo === 'orquestador_obtenerFotos' && !modulosActivos.fotos) return setTimeout(() => reject(new Error("Módulo Fotos Caído")), 400);
        if (metodo === 'obtenerUbicaciones' && !modulosActivos.nucleo) return setTimeout(() => reject(new Error("Módulo Núcleo Caído")), 400);
        if ((metodo === 'agregarTerreno' || metodo === 'actualizarTerreno') && !modulosActivos.formularios) return setTimeout(() => reject(new Error("Módulo Escritura Inaccesible")), 400);
        if (metodo === 'obtenerDireccionPorCoordenadas' && !modulosActivos.geocoder) return setTimeout(() => reject(new Error("Módulo Google Maps Caído")), 400);
      }
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[metodo](...parametros);
    });
  };

  let map, markerLayerGroup, primeraCarga = true; 
  let selectedLat = null, selectedLng = null;
  let marcadoresGuardados = {}, marcadoresData = [], userMarkerMain = null;
  let isMeasuring = false, measurePoints = [], measurePolyline = null, measureMarkers = [];
  let isAdding = false, tempAddMarker = null;
  let currentPhotos = [], currentPhotoIndex = 0, fotosActualesCount = 0;

  const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' });
  const googleSat = L.tileLayer('http://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3'] });

  // ==========================================
  // NOTIFICACIONES MODERNAS
  // ==========================================
  function mostrarToast(mensaje, estado = 'loading') {
    const toast = document.getElementById('toast-notif');
    toast.style.display = 'flex';
    let icono = '';
    if (estado === 'loading') { toast.style.borderLeftColor = '#1a73e8'; icono = '<div class="spinner-modern"></div>'; } 
    else if (estado === 'success') { toast.style.borderLeftColor = '#34a853'; icono = '<div style="color:#34a853; font-weight:bold; font-size:16px; margin-top:-2px;">✓</div>'; } 
    else if (estado === 'error') { toast.style.borderLeftColor = '#ea4335'; icono = '<div style="color:#ea4335; font-weight:bold; font-size:16px; margin-top:-2px;">✕</div>'; } 
    else if (estado === 'info') { toast.style.borderLeftColor = '#fbbc04'; icono = '<div style="color:#fbbc04; font-weight:bold; font-size:16px; margin-top:-2px;">!</div>'; }
    toast.innerHTML = icono + '<span>' + mensaje + '</span>';
  }
  function ocultarToast(delay = 0) { setTimeout(() => { document.getElementById('toast-notif').style.display = 'none'; }, delay); }

  const comprimirImagen = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader(); reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image(); img.src = event.target.result;
      img.onload = () => {
        const MAX_WIDTH = 1200, MAX_HEIGHT = 1200; let width = img.width, height = img.height;
        if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
        else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
        const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height); resolve(canvas.toDataURL('image/jpeg', 0.7));
      }; img.onerror = () => reject(new Error("Error procesando imagen"));
    }; reader.onerror = () => reject(new Error("Error leyendo archivo"));
  });

  // ==========================================
  // INICIO SECUENCIAL
  // ==========================================
  window.onload = async function() { 
    try {
      if (MODO_DESARROLLADOR) { const panel = document.getElementById('dev-panel'); if (panel) panel.style.display = 'block'; }
      initMap(); 
      const opciones = await servidor('obtenerOpcionesDesplegables'); llenarDesplegables(opciones);
      await iniciarCargaDeDatos();
      
      setInterval(chequeoRapido, 5000); 
    } catch (error) { console.error("Error en inicio:", error); }
  };

  function generarFirma(m) { 
    return [m.id, m.color, m.tachado, m.visitado, m.estado, m.relevo, m.notas].join('|'); 
  }

  async function chequeoRapido() {
    try {
      const tokenLocal = String(localStorage.getItem('terrenosToken') || "0");
      const tokenNube = String(await servidor('comprobarCambios'));
      if (tokenNube !== "0" && tokenNube !== tokenLocal) {
        localStorage.setItem('terrenosToken', tokenNube);
        await sincronizarDeFondo(); 
      }
    } catch(e) { }
  }

  function initMap() {
    map = L.map('map', { center: [-27.36708, -55.89608], zoom: 13, layers: [osmLayer], zoomControl: false });
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.control.layers({ "Mapa Base": osmLayer, "Satélite": googleSat }).addTo(map);
    
    markerLayerGroup = L.layerGroup().addTo(map); 

    map.on('click', function(e) { 
      if (isMeasuring) { agregarPuntoMedicion(e.latlng); } else if (isAdding) { abrirModalAñadir(e.latlng.lat, e.latlng.lng); } else { restaurarPines(); }
    });
    setTimeout(() => map.invalidateSize(), 500);
  }

  function llenarDesplegables(opciones) {
    const selectDistrito = document.getElementById('form-distrito'); const selectVendedor = document.getElementById('form-vendedor');
    opciones.distritos.forEach(d => selectDistrito.add(new Option(d, d))); opciones.vendedores.forEach(v => selectVendedor.add(new Option(v, v)));
  }

  // ==========================================
  // ORQUESTADOR DE PINES SEGURO
  // ==========================================
  function obtenerPinSeguro(m) {
    let capa = null;
    try {
      if (!modulosActivos.pines) throw new Error("Módulo Pines apagado desde el panel DEV");
      if (typeof ModuloPines === 'undefined') throw new Error("Módulo Pines no cargado");
      
      capa = ModuloPines.armarMarcador(m);
      capa.on('click', function() { 
        if(isMeasuring || isAdding) return; 
        resaltarPin(m.id); 
        cargarFotosEnPopup(m.id); 
      });
    } catch (e) {
      console.warn("Fallo visual en pin " + m.id + ". Usando sistema de emergencia:", e);
      const defaultIcon = new L.Icon.Default();
      capa = L.marker([m.lat, m.lng], {icon: defaultIcon}); 
      capa.bindPopup("<b>" + m.id + "</b><br>Error visual.<br><br><button onclick=\"abrirModalEdicion('" + m.id + "')\">Editar Datos</button>");
      capa.on('click', function() { if(isMeasuring || isAdding) return; cargarFotosEnPopup(m.id); });
    }
    return capa;
  }

  // 1. CARGA INICIAL INMEDIATA
  async function iniciarCargaDeDatos() {
    document.getElementById('loading').style.display = 'none'; 
    const cacheLocal = localStorage.getItem('terrenosPosadas');
    if (cacheLocal) {
      try {
        marcadoresData = JSON.parse(cacheLocal);
        let bounds = [];
        marcadoresData.forEach(m => {
          let capa = obtenerPinSeguro(m); 
          bounds.push([m.lat, m.lng]);
          marcadoresGuardados[m.id] = { capa: capa, color: m.color, tachado: m.tachado, visitado: m.visitado, estado: m.estado, hashStr: generarFirma(m) };
          markerLayerGroup.addLayer(capa);
        });
        if (bounds.length > 0) map.fitBounds(bounds);
        primeraCarga = false;
      } catch(e) { localStorage.removeItem('terrenosPosadas'); }
    } else { mostrarToast("Descargando terrenos...", "loading"); }
    
    await sincronizarDeFondo();
  }

  // 2. SINCRONIZADOR DIFERENCIAL 
  async function sincronizarDeFondo() {
    try {
      const respuesta = await servidor('obtenerUbicaciones');
      if (!respuesta) return;
      
      const nuevosMarcadores = (respuesta.marcadores) ? respuesta.marcadores : respuesta; 
      const idsNuevos = new Set(nuevosMarcadores.map(m => String(m.id)));
      let huboCambios = false;
      let pinesAAgregar = [];

      for (let idViejo in marcadoresGuardados) {
        if (!idsNuevos.has(idViejo) && !idViejo.includes("Guardando")) {
          markerLayerGroup.removeLayer(marcadoresGuardados[idViejo].capa);
          delete marcadoresGuardados[idViejo];
          huboCambios = true;
        }
      }

      nuevosMarcadores.forEach(mNuevo => {
        let pinExistente = marcadoresGuardados[mNuevo.id];
        let nuevoHash = generarFirma(mNuevo);

        if (!pinExistente || pinExistente.hashStr !== nuevoHash) {
           if (pinExistente) markerLayerGroup.removeLayer(pinExistente.capa);
           
           let capa = obtenerPinSeguro(mNuevo);
           
           marcadoresGuardados[mNuevo.id] = { capa: capa, color: mNuevo.color, tachado: mNuevo.tachado, visitado: mNuevo.visitado, estado: mNuevo.estado, hashStr: nuevoHash };
           pinesAAgregar.push(capa);
           huboCambios = true;
        }
      });

      if (pinesAAgregar.length > 0) {
        pinesAAgregar.forEach(capa => markerLayerGroup.addLayer(capa));
      }

      if (huboCambios || primeraCarga) {
        marcadoresData = nuevosMarcadores;
        localStorage.setItem('terrenosPosadas', JSON.stringify(nuevosMarcadores));
        
        if (primeraCarga) {
          const bounds = nuevosMarcadores.map(m => [m.lat, m.lng]);
          if(bounds.length > 0) map.fitBounds(bounds);
        }
      }
      primeraCarga = false;
    } catch(err) { console.warn("Error en sincronización de fondo:", err); }
  }

  function resaltarPin(id) {
    if (!modulosActivos.pines || typeof ModuloPines === 'undefined') return;
    for (let key in marcadoresGuardados) {
      let m = marcadoresGuardados[key];
      if (m.capa.setIcon) { 
        if (key === id) m.capa.setIcon(ModuloPines.crearIcono(m.color, 'pin-selected', m.tachado, m.visitado, m.estado));
        else m.capa.setIcon(ModuloPines.crearIcono(m.color, 'pin-dimmed', m.tachado, m.visitado, m.estado));
      }
    }
  }

  function restaurarPines() {
    if (!modulosActivos.pines || typeof ModuloPines === 'undefined') return;
    for (let key in marcadoresGuardados) {
      let m = marcadoresGuardados[key];
      if (m.capa.setIcon) m.capa.setIcon(ModuloPines.crearIcono(m.color, 'pin-normal', m.tachado, m.visitado, m.estado));
    }
  }

  // ==========================================
  // LÓGICA DE FOTOS Y LIGHTBOX
  // ==========================================
  async function cargarFotosEnPopup(idTerreno) {
    const container = document.getElementById("fotos-" + idTerreno);
    if (!container || container.innerHTML.includes("photo-carousel") || container.dataset.estado === "listo") return;
    container.innerHTML = "<span style='font-size:12px; color:#1a73e8;'><div class='spinner-modern' style='display:inline-block; width:10px; height:10px; border-width:2px; vertical-align:middle; margin-right:5px;'></div>Buscando fotos...</span>";
    try {
      const fotos = await servidor('orquestador_obtenerFotos', idTerreno); container.dataset.estado = "listo";
      if (!fotos || fotos.length === 0) { container.style.display = 'none'; return; }
      window["fotos_" + idTerreno] = fotos; let html = "<div class='photo-carousel'>";
      fotos.forEach((fId, index) => { html += "<img src='https://drive.google.com/thumbnail?id=" + fId + "&sz=w400' onclick='abrirLightbox(\"" + idTerreno + "\", " + index + ")'>"; });
      html += "</div>"; container.innerHTML = html;
    } catch(err) { container.dataset.estado = "listo"; container.innerHTML = "<span style='font-size:12px; color:#ea4335;'>✕ Error al cargar</span>"; }
  }
  function abrirLightbox(idTerreno, index) { currentPhotos = window["fotos_" + idTerreno]; currentPhotoIndex = index; document.getElementById('lightbox').style.display = 'flex'; actualizarLightbox(); }
  function actualizarLightbox() { document.getElementById('lightbox-img').src = "https://drive.google.com/thumbnail?id=" + currentPhotos[currentPhotoIndex] + "&sz=w1500"; document.getElementById('lightbox-count').innerText = (currentPhotoIndex + 1) + " / " + currentPhotos.length; document.getElementById('lb-prev').disabled = (currentPhotoIndex === 0); document.getElementById('lb-next').disabled = (currentPhotoIndex === currentPhotos.length - 1); }
  function lightboxNext() { if (currentPhotoIndex < currentPhotos.length - 1) { currentPhotoIndex++; actualizarLightbox(); } }
  function lightboxPrev() { if (currentPhotoIndex > 0) { currentPhotoIndex--; actualizarLightbox(); } }
  function cerrarLightbox() { document.getElementById('lightbox').style.display = 'none'; document.getElementById('lightbox-img').src = ""; }

  // ==========================================
  // FORMULARIOS (AÑADIR, EDITAR Y SEGUNDO PLANO)
  // ==========================================
  // Actualiza estas dos funciones dentro de JS_Logica.html
function actualizarUIFotos() {
  const input = document.getElementById('form-fotos');
  const contador = document.getElementById('foto-contador');
  if (contador) {
    contador.innerText = `${fotosActualesCount} foto(s) guardadas.`;
  }
  if (input) {
    input.style.display = 'block'; // Nunca se oculta
  }
}
  
  async function abrirModalAñadir(lat, lng) {
    selectedLat = lat; selectedLng = lng; if (tempAddMarker) map.removeLayer(tempAddMarker);
    
    let iconAdd;
    try {
      if (!modulosActivos.pines || typeof ModuloPines === 'undefined') throw new Error();
      iconAdd = ModuloPines.crearIcono('#1a73e8', 'pin-normal', false, 'No', 'Baldío');
    } catch(e) { iconAdd = new L.Icon.Default(); }

    tempAddMarker = L.marker([lat, lng], {icon: iconAdd}).addTo(map);
    
    document.getElementById('form-titulo').innerText = "Nuevo Terreno"; document.getElementById('form-titulo').style.color = "#1a73e8";
    document.getElementById('form-coords-text').innerText = "Coordenadas: " + lat.toFixed(6) + ", " + lng.toFixed(6); document.getElementById('form-coords-text').style.display = "block"; document.getElementById('form-id').value = ""; 
    document.getElementById('form-visitado').value = "No"; document.getElementById('form-distrito').value = ""; document.getElementById('form-barrio').value = ""; document.getElementById('form-frente').value = ""; document.getElementById('form-fondo').value = ""; document.getElementById('form-propietario').value = ""; document.getElementById('form-contacto').value = ""; document.getElementById('form-vendedor').value = ""; document.getElementById('form-relevo').value = ""; document.getElementById('form-notas').value = "";
    fotosActualesCount = 0; document.getElementById('fotos-existentes-container').innerHTML = ""; actualizarUIFotos();
    const inputDir = document.getElementById('form-direccion'); inputDir.value = "Buscando calle..."; inputDir.style.color = "#1a73e8"; document.getElementById('modal-terreno').style.display = 'flex';
    try { const direccion = await servidor('obtenerDireccionPorCoordenadas', lat, lng); inputDir.style.color = "#333"; inputDir.value = direccion ? direccion : ""; if(!direccion) inputDir.placeholder = "Ingresa la calle manualmente"; } 
    catch(e) { inputDir.style.color = "#333"; inputDir.value = ""; inputDir.placeholder = "Error, ingresa manual"; }
  }
  
  async function abrirModalEdicion(id) {
    const terreno = marcadoresData.find(m => m.id === id); if (!terreno) return;
    document.getElementById('form-titulo').innerText = "Editar " + terreno.id; document.getElementById('form-titulo').style.color = "#fbbc04";
    document.getElementById('form-coords-text').style.display = "none"; document.getElementById('form-id').value = terreno.id;
    document.getElementById('form-visitado').value = terreno.visitado || "No"; document.getElementById('form-distrito').value = terreno.distrito || ""; document.getElementById('form-barrio').value = terreno.barrio || "";
    const inputDir = document.getElementById('form-direccion'); inputDir.value = terreno.direccion || ""; inputDir.style.color = "#333";
    
    // TRADUCTOR DE COMA A PUNTO PARA QUE EL CELULAR LO ENTIENDA
    document.getElementById('form-frente').value = String(terreno.frente || "").replace(',', '.'); 
    document.getElementById('form-fondo').value = String(terreno.fondo || "").replace(',', '.'); 
    
    document.getElementById('form-propietario').value = terreno.propietario || ""; document.getElementById('form-contacto').value = terreno.contacto || ""; document.getElementById('form-vendedor').value = terreno.vendedor || ""; document.getElementById('form-relevo').value = terreno.relevo || ""; document.getElementById('form-notas').value = terreno.notas || ""; document.getElementById('form-tipoLote').value = terreno.tipoLote || "Entre Medianeras"; document.getElementById('form-estadoActual').value = terreno.estado || "Baldío";
    const contenedor = document.getElementById('fotos-existentes-container'); contenedor.innerHTML = "<span style='font-size:12px; color:#1a73e8;'><div class='spinner-modern' style='display:inline-block; width:10px; height:10px; border-width:2px; vertical-align:middle; margin-right:5px;'></div>Buscando fotos...</span>"; fotosActualesCount = 0; actualizarUIFotos(); document.getElementById('modal-terreno').style.display = 'flex';
    try { const fotos = await servidor('orquestador_obtenerFotos', id); fotosActualesCount = fotos.length; contenedor.innerHTML = ""; fotos.forEach(fId => { contenedor.innerHTML += `<div class="thumb-edit-box" id="thumb-${fId}"><img src="https://drive.google.com/thumbnail?id=${fId}&sz=w200"><button onclick="borrarFotoFront('${id}', '${fId}')">❌</button></div>`; }); actualizarUIFotos(); } 
    catch(e) { contenedor.innerHTML = "<span style='color:#ea4335; font-size:12px;'>No se cargaron miniaturas.</span>"; }
  }
  function cerrarModalTerreno() { document.getElementById('modal-terreno').style.display = 'none'; if (document.getElementById('form-id').value === "") toggleAddMode(); }
  
async function guardarFormulario(btn) {
  const id = document.getElementById('form-id').value; 
  const direccion = document.getElementById('form-direccion').value; 
  const inputFotos = document.getElementById('form-fotos');
  
  if (!direccion) return alert("La dirección es obligatoria."); 
  
  const datos = { 
    // 👇 Agregamos .toUpperCase() a esta primera línea 👇
    visitado: document.getElementById('form-visitado').value.toUpperCase(), 
    distrito: document.getElementById('form-distrito').value, 
    barrio: document.getElementById('form-barrio').value, 
    direccion: direccion, 
    tipoLote: document.getElementById('form-tipoLote').value, 
    estadoActual: document.getElementById('form-estadoActual').value, 
    frente: document.getElementById('form-frente').value.replace('.', ','), 
    fondo: document.getElementById('form-fondo').value.replace('.', ','), 
    propietario: document.getElementById('form-propietario').value, 
    contacto: document.getElementById('form-contacto').value, 
    vendedor: document.getElementById('form-vendedor').value, 
    relevo: document.getElementById('form-relevo').value, 
    notas: document.getElementById('form-notas').value 
  };

  // ... (el resto del código queda exactamente igual)
  
  let colorOptimista = (datos.visitado.toLowerCase() === "si" || datos.visitado.toLowerCase() === "sí") ? "#4285f4" : "#9aa0a6";

  if (id === "") {
    if (!selectedLat || !selectedLng) return alert("No hay coordenadas fijadas."); 
    datos.lat = selectedLat; datos.lng = selectedLng;
    const nuevoPinLocal = { id: "⌛ Guardando...", lat: datos.lat, lng: datos.lng, visitado: datos.visitado, distrito: datos.distrito, barrio: datos.barrio, direccion: datos.direccion, tipoLote: datos.tipoLote, estado: datos.estadoActual, supTotal: "-", relevo: datos.relevo, propietario: datos.propietario, contacto: datos.contacto, vendedor: datos.vendedor, notas: datos.notas, poligono: null, color: colorOptimista, tachado: false };
    
    let capa = obtenerPinSeguro(nuevoPinLocal);
    marcadoresGuardados[nuevoPinLocal.id] = { capa: capa, color: colorOptimista, tachado: false, visitado: datos.visitado, estado: datos.estadoActual, hashStr: "temp" };
    markerLayerGroup.addLayer(capa);
  } else {
    let pinAntiguo = marcadoresGuardados[id];
    if(pinAntiguo && pinAntiguo.color !== "#ea4335") {
       markerLayerGroup.removeLayer(pinAntiguo.capa);
       let mActualizado = { ...marcadoresData.find(m => m.id === id), ...datos };
       mActualizado.color = colorOptimista;
       
       let capa = obtenerPinSeguro(mActualizado);
       marcadoresGuardados[id] = { capa: capa, color: colorOptimista, tachado: false, visitado: datos.visitado, estado: datos.estadoActual, hashStr: JSON.stringify(mActualizado) };
       markerLayerGroup.addLayer(capa);
    }
  }

  const archivosSubir = Array.from(inputFotos.files); 
  inputFotos.value = ""; 
  cerrarModalTerreno();
  guardarEnSegundoPlano(id, datos, archivosSubir);
}

  async function guardarEnSegundoPlano(id, datos, archivosSubir) {
    mostrarToast((id === "") ? "Creando nuevo terreno..." : "Guardando edición de " + id + "...", "loading");
    try {
      let idFinal = id;
      if (id === "") { 
        idFinal = await servidor('agregarTerreno', datos); 
        if (marcadoresGuardados["⌛ Guardando..."]) { 
          markerLayerGroup.removeLayer(marcadoresGuardados["⌛ Guardando..."].capa); 
          delete marcadoresGuardados["⌛ Guardando..."]; 
        }
      } else { 
        await servidor('actualizarTerreno', id, datos); 
      }
      mostrarToast("¡Terreno " + idFinal + " guardado!", "success");
      
      setTimeout(sincronizarDeFondo, 500);

      if (archivosSubir.length > 0) { setTimeout(() => { procesarFotosEnSegundoPlano(archivosSubir, idFinal); }, 1500); } 
      else { ocultarToast(3000); }
    } catch (err) { 
      if (id === "" && marcadoresGuardados["⌛ Guardando..."]) { 
        markerLayerGroup.removeLayer(marcadoresGuardados["⌛ Guardando..."].capa); 
        delete marcadoresGuardados["⌛ Guardando..."]; 
      }
      mostrarToast("Error al guardar: " + err.message, "error"); 
      ocultarToast(6000); 
    }
  }
  
  async function procesarFotosEnSegundoPlano(archivos, idTerreno) {
    try {
      for(let i=0; i < archivos.length; i++) {
         mostrarToast("Subiendo foto " + (i+1) + "/" + archivos.length + " de " + idTerreno + "...", "loading");
         let base64 = await comprimirImagen(archivos[i]); await servidor('subirImagenDrive', base64, idTerreno, 'image/jpeg');
      }
      mostrarToast("¡Fotos de " + idTerreno + " listas!", "success"); if(window["fotos_" + idTerreno]) delete window["fotos_" + idTerreno]; 
    } catch (err) { mostrarToast("Error subiendo fotos: " + err.message, "error"); }
    ocultarToast(4000);
  }

function toggleAddMode() {
    isAdding = !isAdding;
    const btnAdd = document.getElementById('btn-add');
    
    if (isAdding) {
      // Si la regla está midiendo, la apagamos
      if (isMeasuring) toggleMeasure(); 
      
      btnAdd.classList.add('active');
      mostrarToast("Toca el mapa para ubicar el nuevo terreno", "info");
      document.getElementById('map').style.cursor = 'crosshair';
    } else {
      btnAdd.classList.remove('active');
      document.getElementById('map').style.cursor = '';
      ocultarToast();
      
      // Si había un pin fantasma flotando porque no guardó, lo borramos
      if (tempAddMarker) {
        map.removeLayer(tempAddMarker);
        tempAddMarker = null;
      }
    }
  }
  function triggerGPS() {
    if (!navigator.geolocation) return alert("Tu navegador no soporta geolocalización.");
    navigator.geolocation.getCurrentPosition(
      function(position) {
        const lat = position.coords.latitude; const lng = position.coords.longitude; map.setView([lat, lng], 18); 
        if (isAdding) abrirModalAñadir(lat, lng);
        else { const htmlIcon = "<div class='user-dot'></div>"; const userIcon = L.divIcon({ className: 'user-dot-container', html: htmlIcon, iconSize: [22, 22], iconAnchor: [11, 11] }); if (userMarkerMain) userMarkerMain.setLatLng([lat, lng]); else userMarkerMain = L.marker([lat, lng], {icon: userIcon}).addTo(map); }
      }, function(error) { alert("Asegúrate de encender el GPS."); }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
    );
  }
  function toggleMeasure() {
    if (isAdding) toggleAddMode(); isMeasuring = !isMeasuring; const btn = document.getElementById('btn-measure'), resultBox = document.getElementById('measure-result');
    if (isMeasuring) { btn.classList.add('active'); resultBox.style.display = 'flex'; resultBox.innerText = "Toca el mapa para medir"; document.getElementById('map').style.cursor = 'crosshair'; } 
    else { btn.classList.remove('active'); resultBox.style.display = 'none'; document.getElementById('map').style.cursor = ''; clearMeasure(); }
  }
  function clearMeasure() { if (measurePolyline) map.removeLayer(measurePolyline); measureMarkers.forEach(m => map.removeLayer(m)); measurePoints = []; measureMarkers = []; measurePolyline = null; }
  function agregarPuntoMedicion(latlng) {
    measurePoints.push(latlng); measureMarkers.push(L.circleMarker(latlng, {color: '#ea4335', radius: 5, fillOpacity: 1}).addTo(map));
    if (measurePoints.length > 1) { if (measurePolyline) map.removeLayer(measurePolyline); measurePolyline = L.polyline(measurePoints, {color: '#ea4335', weight: 4, dashArray: '5, 10'}).addTo(map); let dist = 0; for (let i = 1; i < measurePoints.length; i++) dist += map.distance(measurePoints[i-1], measurePoints[i]); document.getElementById('measure-result').innerText = dist.toFixed(1) + " m"; }
  }
</script>
